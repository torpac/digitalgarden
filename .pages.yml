  - name: rating
    label: Rating /10
    type: number
  - name: year
    label: Release year
    type: number
  - name: watched
    label: Date watched
    type: date
  - name: description
    label: Short impression
    type: text
  - name: tags
    label: Tags
    type: string
    list: true
  - name: draft
    label: Hide from public website (draft)
    type: boolean
  - name: example
    label: Placeholder example
    type: boolean
  - name: body
    label: Your film review
    type: rich-text
