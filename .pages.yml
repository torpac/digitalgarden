- name: posts
  label: ✳ Garden / Posts
  type: collection
  path: src/content/posts
  format: yaml-frontmatter
  filename: '{title}.md'
  view:
    primary: title
    fields:
    - title
    - date
    - stage
    - draft
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Post title
    type: string
    required: true
  - name: date
    label: Published date
    type: date
    required: true
  - name: updated
    label: Last updated (optional)
    type: date
  - name: description
    label: Short description
    type: text
  - name: cover
    label: Cover image (upload or choose)
    type: image
  - name: tags
    label: Tags / topics
    type: string
    list: true
  - name: stage
    label: How developed is this idea?
    type: select
    options:
      values:
      - name: seedling
        label: ✳ Seedling — new idea
      - name: growing
        label: ❋ Growing — work in progress
      - name: evergreen
        label: ✦ Evergreen — more developed
  - name: featured
    label: Featured post
    type: boolean
  - name: draft
    label: Hide from public website (draft)
    type: boolean
  - name: example
    label: Placeholder example
    type: boolean
  - name: body
    label: Your post
    type: rich-text
- name: films
