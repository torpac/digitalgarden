# Edit every word, link, collection and common design setting through Pages CMS.
media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories:
  - image
content:
- name: site
  label: 01 — Identity, socials, navigation, text
  type: file
  path: src/data/site.json
  format: json
  operations:
    delete: false
  fields:
  - name: name
    label: Your display name
    type: string
  - name: headline
    label: Homepage main headline
    type: string
  - name: intro
    label: Homepage description
    type: text
  - name: about
    label: About main paragraph
    type: text
  - name: aboutExtra
    label: About extra paragraph
    type: text
  - name: aboutSignoff
    label: About sign-off
    type: string
  - name: aboutMeta
    label: About card tiny heading
    type: string
  - name: siteTagline
    label: Top right header sentence
    type: string
  - name: windowTitle
    label: Browser-style top window label
    type: string
  - name: brandSuffix
    label: Character after your name
    type: string
  - name: brandMark
    label: Symbol before your name
    type: string
  - name: browserTitleSuffix
    label: Browser tab description
    type: string
  - name: statusLine
    label: Site status message
    type: string
  - name: nowWatching
    label: Currently watching
    type: string
  - name: nowPlaying
    label: Currently playing
    type: string
  - name: nowReading
    label: Currently reading
    type: string
  - name: nowListening
    label: Currently listening
    type: string
  - name: footerLine
    label: Footer message
    type: string
  - name: footerCopyrightNote
    label: Copyright line additional text
    type: string
  - name: footerMark
    label: Footer symbol
    type: string
  - name: sidebarSkyTitle
    label: Sky widget title
    type: string
  - name: sidebarSkyCaption
    label: Sky widget caption
    type: string
  - name: sidebarSkyAlt
    label: Sky image description
    type: string
  - name: sidebarExplorerTitle
    label: Explorer widget title
    type: string
  - name: sidebarCurrentTitle
    label: Currently widget title
    type: string
  - name: sidebarSocialTitle
    label: Socials widget title
    type: string
  - name: sidebarStamp
    label: Sidebar tiny stamp
    type: string
  - name: sidebarSocialMissing
    label: Text when a social link is missing
    type: string
  - name: faviconImage
    label: Browser tab icon image
    type: image
  - name: brandImage
    label: Image logo (optional, otherwise text)
    type: image
  - name: heroImage
    label: Homepage sky panel image (optional)
    type: image
  - name: sidebarSkyImage
    label: Sidebar night-sky image (optional)
    type: image
  - name: currentlyLabels
    label: Currently field captions
    type: object
    fields:
    - name: watching
      label: Watching
      type: string
    - name: playing
      label: Playing
      type: string
    - name: reading
      label: Reading
      type: string
    - name: listening
      label: Listening
      type: string
  - name: socialLinks
    label: Social links — add, reorder, remove
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: Button text
      type: string
    - name: url
      label: Full HTTPS profile URL
      type: string
    - name: enabled
      label: Show link
      type: boolean
  - name: navigation
    label: Main top navigation — re-order / rename / hide
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: Link text
      type: string
    - name: href
      label: Internal path, e.g. /films/
      type: string
    - name: icon
      label: Optional leading symbol
      type: string
    - name: enabled
      label: Show in header
      type: boolean
  - name: folders
    label: Homepage folders — re-order / edit / hide
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Folder name
      type: string
    - name: href
      label: Internal path
      type: string
    - name: symbol
      label: Symbol
      type: string
    - name: description
      label: Subtitle
      type: string
    - name: enabled
      label: Show folder
      type: boolean
  - name: favoritesShelves
    label: Homepage ranking categories — re-order / hide
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Shelf name (films, games, series, books)
      type: string
    - name: href
      label: Internal path
      type: string
    - name: symbol
      label: Symbol
      type: string
    - name: enabled
      label: Show shelf
      type: boolean
  - name: homeSections
    label: Homepage section order — rearrange or hide groups
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{section}'
    fields:
    - name: section
      label: Section ID (hero / folders_recent / favorites / pinboard / goodbye)
      type: select
      options:
        values:
        - name: hero
          label: Hero
        - name: folders_recent
          label: Folders recent
        - name: favorites
          label: Favorites
        - name: pinboard
          label: Pinboard
        - name: goodbye
          label: Goodbye
    - name: enabled
      label: Show section
      type: boolean
